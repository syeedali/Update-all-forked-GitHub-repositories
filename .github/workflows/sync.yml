name: Sync All Forks

on:
  workflow_dispatch: # Allows you to run it manually with a button click
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight UTC

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync forks using GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          # Fetch up to 200 fork repositories and loop through them
          gh repo list --fork --limit 200 --json nameWithOwner -q '.[].nameWithOwner' | while read -r repo; do
              echo "Syncing $repo..."
              gh repo sync --force "$repo" || echo "Failed to sync $repo (might have no changes or conflicts)"
          done
