name: Sync All Forks Safely

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Disable workflows and sync forks
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          gh repo list --fork --limit 200 --json nameWithOwner -q '.[].nameWithOwner' | while read -r repo; do
              echo "----------------------------------------"
              echo "Processing $repo..."
              
              echo "Disabling workflows for safety..."
              gh api -X PUT "/repos/$repo/actions/permissions" --input - <<< '{"enabled": false}' || echo "Note: Skipping security toggle"
              
              echo "Syncing changes..."
              # Added the --force flag to blast past diverging branch conflicts
              gh repo sync "$repo" --force || echo "Failed to sync $repo"
          done
